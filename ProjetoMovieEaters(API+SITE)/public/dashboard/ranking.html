<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranking</title>

    <script src="../js/validar.js"></script>
    <link rel="stylesheet" href="../css/styleRanking.css">
    <link rel="icon" href="/assets/logonova.png">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body onload="carregadorDados(), descobrirPapel()">

    <div class="container">

        <div class="header">

            <div class="left">
                Bem vindo
            </div>

            <div class="center">
                <ul class="navbar">
                    <li>
                        <a href="#" onclick="conferir()">FILME DA SEMANA</a>
                    </li>
                    <li class="ativo"><a href="">RANKING</a></li>
                    <li><a href="../dashboard/historico.html">HISTÓRICO</a></li>
                    <li><a href="./review.html">REVIEWS</a></li>
                    <li class="direita"><a href="#" onclick="sairGrupo()">SAIR</a></li>
                </ul>
            </div>
        </div>

        <div class="nomeGrupo" id="nome_Grupo">
            <H3>Grupo: Os assistidores</H3>
        </div>

        <div class="kpis">

            <div class="indicativo">
                <span class="titulo">Sua posição atual no grupo:</span>
                <span class="valor" id="posicao">1</span>
            </div>

            <div class="indicativo">
                <span class="titulo">Sua pontuação no grupo:</span>
                <span class="valor" id="total">78 Pontos</span>
            </div>

            <div class="indicativo">
                <span class="titulo">Líder atual do grupo:</span>
                <span class="valor" id="lider">Yuri</span>
            </div>

            <div class="indicativo">
                <span class="titulo">Sua distância do lider do grupo:</span>
                <span class="valor" id="distancia">0 Pontos</span>
            </div>

        </div>

        <div class="graficos">
            <div class="grafico1"> <canvas class="graficoEvolucao" id="graficoEvolucao"></canvas> </div>
            <div class="grafico2"> </div><canvas class="graficoRanking" id="graficoRanking"></canvas>
        </div>
    </div>

    </div>

</body>

</html>


<script>

    let posicao = 1;
    let index = 0;

    function carregadorDados() {
        var nomeUsuario = sessionStorage.getItem("NOME_USUARIO");
        let idGrupo = Number(sessionStorage.getItem("ID_GRUPO"));
        console.log(idGrupo)

        let nomeGrupo = sessionStorage.NOME_GRUPO;
        console.log(nomeGrupo)
        nome_Grupo.innerHTML = `Grupo: <tag style="color:#ffc500">${nomeGrupo}</tag>`

        fetch(`/pontuacao/listar/${idGrupo}`) 
            .then(res => res.json())
            .then(dados => {

                console.log(dados);

                // validando se não veio vazio 
                if (dados.length == 0) {

                    document.getElementById("posicao").innerText = "-";
                    document.getElementById("total").innerText = "0";
                    document.getElementById("lider").innerText = "SEM LÍDER";
                    document.getElementById("distancia").innerText = "0 pontos";
                    return;
                }

                // for para pegar a posição de cada usuário a partir do nome
                for (let i = 0; i < dados.length; i++) {

                    if (dados[i].nome == nomeUsuario) {
                        index = i;
                        posicao = index + 1;
                    }

                }

                // dados da KPI
                document.getElementById("posicao").innerHTML = posicao;
                document.getElementById("total").innerHTML = dados[index].total;
                document.getElementById("lider").innerHTML = dados[0].nome.toUpperCase(); // dados 0 pq no order by desc o lider sempre vem 1º
                document.getElementById("distancia").innerHTML = (dados[0].total - dados[index].total) + ' pontos';
                document.querySelector(".left").innerHTML = "Bem vindo, " + nomeUsuario;

                // vetores para a criação do gráfico de ranking
                let nomes = [];
                let valores = [];

                // preenchendo nome e valores que vão alimentar o gráfico, como na query eu ordeno pelo desc, eu sempre seleciono o lider como 0
                for (let i = 0; i < dados.length; i++) {

                    nomes.push(dados[i].nome);
                    valores.push(dados[i].total);

                }

                const grafico2 = document.getElementById('graficoRanking');

                new Chart(grafico2, {

                    type: 'bar', //

                    data: {
                        labels: nomes, // eixo y dos nomes

                        datasets: [{
                            label: 'Pontuação', // eixo x

                            data: valores, // Valores correspondentes a cada nome

                            backgroundColor: '#2c6794',

                            borderRadius: 20,

                            barThickness: 35 // Define a altura das barras
                        }]
                    },

                    options: {
                        indexAxis: 'y', // Faz o gráfico ficar horizontal (eixo principal vira o Y)

                        responsive: true, 

                        plugins: {
                            legend: {
                                display: false
                            },

                            title: {
                                display: true, 
                                text: 'Ranking geral da competição', 
                                color: '#ffffff',
                                font: {
                                    size: 20 
                                }
                            },

                            tooltip: {
                                enabled: true // hover do gráfico, padrão do chartjs
                            }
                        },

                        scales: {
                            x: {
                                beginAtZero: true, // Começa o eixo X no zero

                                ticks: {
                                    color: '#ccc', // Cor dos números do eixo X
                                },

                                grid: {
                                    color: 'rgba(255,255,255,0.1)' // Cor das linhas de fundo (grade)
                                },

                                title: {
                                    display: true, // Mostra o título do eixo X
                                    text: 'Pontuação',
                                    color: '#ccc' 
                                }
                            },

                            y: {
                                ticks: {
                                    color: '#ccc' // Cor dos nomes
                                },

                                grid: {
                                    display: false // Remove as linhas de grade horizontais
                                }
                            }
                        }
                    }
                });

                carregarGrafico()

            })
            .catch(erro => {
                console.log("Erro:", erro);
            });

    }

    function carregarGrafico() { // função para carregar o gráfico de progresso semanal

     let idGrupo = Number(sessionStorage.getItem("ID_GRUPO"));

        let play1 = [] // vetores para salvar a posição em cada semana de cada usuário
        let play2 = []
        let play3 = []
        let play4 = []

        let semanas = [] // recebe as semanas caso passe do layout
        let layout = ["semana 1", "semana 2", "semana 3", "semana 4"]

        let nome1 = "Convide um amigo"
        let nome2 = "Convide um amigo"
        let nome3 = "Convide um amigo"
        let nome4 = "Convide um amigo"

        fetch(`/ranking/listar/${idGrupo}`)
            .then(res => res.json())
            .then(dados => {

                console.log(dados)

                if (dados.length > 0) {
                    nome1 = dados[0].nome 
                }

                if (dados.length > 1) {
                    nome2 = dados[1].nome 
                }

                if (dados.length > 2) {
                    nome3 = dados[2].nome 
                }

                if (dados.length > 3) {
                    nome4 = dados[3].nome 
                }


                // automatizar o número de semanas no gráfico

                let qntSemanas = dados[0].qtdSemanas;
                definirVencedor(qntSemanas)
                console.log(qntSemanas)


                for (let i = 1; i <= qntSemanas; i++) {
                    semanas.push("Semana " + i)

                    if (i > 4) { layout = semanas }

                }

                // lógica para definir a pontuação por semana

                for (let i = 0; i < dados.length; i++) {

                    if (dados[i].nome == nome1) {
                        let posicao = i % 4 + 1;
                        play1.push(posicao)
                    } else if (dados[i].nome == nome2) {
                        let posicao = i % 4 + 1;
                        play2.push(posicao)
                    } else if (dados[i].nome == nome3) {
                        let posicao = i % 4 + 1;
                          play3.push(posicao)
                    } else {
                        let posicao = i % 4 + 1;
                           play4.push(posicao)
                    }
                }


                // construção do gráfico 1
                const grafico1 = document.getElementById('graficoEvolucao');

                new Chart(grafico1, {
                    type: 'line',
                    data: {
                        labels: layout, // eixo x
                        datasets: [
                            {
                                label: nome1,
                                data: play1,
                                borderColor: "#4A90E2", // cor individual
                                backgroundColor: "#4A90E2",
                                borderWidth: 3, // grossura da linha
                                tension: 0.3 // curva leve
                            },
                            {
                                label: nome2,
                                data: play2,
                                borderColor: "#B084F5",
                                backgroundColor: "#B084F5",
                                borderWidth: 3,
                                tension: 0.3
                            },
                            {
                                label: nome3,
                                data: play3,
                                borderColor: "#F5A623",
                                backgroundColor: "#F5A623",
                                borderWidth: 3,
                                tension: 0.3
                            },
                            {
                                label: nome4,
                                data: play4,
                                borderColor: "#F8E71C",
                                backgroundColor: "#F8E71C",
                                borderWidth: 3,
                                tension: 0.3
                            }
                        ]
                    },
                    options:

                    {
                        plugins: {
                            legend: {
                                position: "bottom"
                            },

                            title: {
                                display: true, 
                                text: 'Classificação Semanal (Quem fez mais pontos naquela semana)', // Texto do título
                                color: '#ffffff', 
                                font: {
                                    size: 20
                                }
                            },

                            tooltip: {
                                enabled: true
                            }
                        },
                        scales: {
                            y: {
                                reverse: true,
                                min: 0,
                                max: 5,
                                ticks: {
                                    stepSize: 1,
                                    callback: function (value) { // função usada para desaparecer o 0 e o 5 no gráfico, questão estética
                                        if (value == 0 || value == 5) {
                                            return "";
                                        }
                                        return value + "º";
                                    }
                                }
                            }
                        }
                    }

                }
                );


            })
            .catch(erro => {
                console.log("Erro:", erro);
            });

    }

    function descobrirPapel() { // função para salvar no sessionStorage o papel no grupo e fazer a validação no "filme da semana"

        let idGrupo = sessionStorage.ID_GRUPO;
        let idUsuario = sessionStorage.ID_USUARIO;

        fetch(`/ranking/papel/${idUsuario}/${idGrupo}`)
            .then(res => res.json())
            .then(dados => {

                let papel = dados[0].papel
                console.log(papel)

                sessionStorage.PAPEL = papel
            })
            .catch(erro => {
                console.log("Erro:", erro);
            });

    }

    function definirVencedor(semanas) {
        if (semanas == 12) {
        alert("O jogo foi finalizado! Caso ainda queiram manter o mesmo grupo, podem dar seguimento a competição!")
        }




    }
</script>
