<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review</title>

    <script src="../js/validar.js"></script>
    <link rel="stylesheet" href="../css/styleReview.css" />
    <link rel="icon" href="/assets/logonova.png">


</head>

<body onload="carregarDados()">

    <div class="container1">

        <div class="header">

            <div class="left">
                Bem vindo, Yuri
            </div>

            <div class="center">
                <ul class="navbar">
                    <a href="#" onclick="conferir()">FILME DA SEMANA</a>
                    <li><a href="../dashboard/ranking.html">RANKING</a></li>
                    <li><a href="../dashboard/historico.html">HISTÓRICO</a></li>
                    <li class="ativo"><a href="">REVIEWS</a></li>
                    <li class="direita"><a href="#" onclick="sairGrupo()">SAIR</a></li>
                </ul>
            </div>
        </div>

        <div class="cadastro">
            <div class="card-cadastro">
                <h2>Hora da Review</h2>
                <div class="formulario">
                    <div class="campo">
                        <div class="linha-esquerda">
                            <span>Nota:</span>
                        </div>
                        <input id="nota_input" type="text" placeholder="0 a 10" />
                    </div>
                    <div class="campo">
                        <div class="linha-esquerda">
                            <span>Review:</span>
                        </div>
                        <textarea class="review" id="review_input"></textarea>
                    </div>
                    <button onclick="cadastrarReview()" class="botao">Enviar</button>
                </div>
            </div>
        </div>
        <h4>Mural de Reviews</h4>
        <div class="mural">
            <div id="feed_container" class="feed-container">
            </div>
        </div>
</body>

</html>

<script>


    function carregarDados() { 

        var nomeUsuario = sessionStorage.NOME_USUARIO;
        document.querySelector(".left").innerHTML = "Bem vindo, " + nomeUsuario;
        let idGrupo = Number(sessionStorage.getItem("ID_GRUPO"));

        fetch(`/filmes/listar/${idGrupo}`) // pegar o id do último filme
            .then(res => res.json())
            .then(dados => {

                console.log(dados);
                var filme = dados[0];
                let idFilme = filme.idfilme;
                sessionStorage.ID_FILME = idFilme;
                console.log(idFilme)
                carregarReview(idFilme, nomeUsuario) // carregar as reviews do último filme

            })
            .catch(erro => {
                console.log("Erro:", erro);
            });


    }

    function cadastrarReview() {

        var nota = nota_input.value;
        var review = review_input.value;
        var idFilme = Number(sessionStorage.ID_FILME);
        console.log(sessionStorage.ID_FILME)
        console.log(idFilme)
        var idUsuario = sessionStorage.ID_USUARIO;

        if (!nota || !review)
        {
            alert("Preencha todos os campos!");
            return;
        }

          if (nota < 0 || nota > 10)
        {
            alert("A nota tem que estar entre 0 e 10!");
            return;
        }


        fetch("/review/cadastrar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
            },
            body: JSON.stringify({
                nota: nota,
                review: review,
                idFilme: idFilme,
                idUsuario: idUsuario
            }),
        })
            .then(function (resposta) {

                console.log("resposta: ", resposta);

                if (resposta.ok) {

                    alert("Review realizada com sucesso")
                    window.location = "./review.html";

                } else if (resposta.status == 409) {
                    alert("Você já fez uma review desse filme")
                    throw "Review Repetida";
                } else {
                    throw "Houve um erro ao tentar realizar a avaliação!";
                }
            })

            .catch(function (erro) {

                console.log(erro);

            });
    }

    function carregarReview(idFilme, nome) {

        fetch(`/review/listar/${idFilme}`)
            .then(res => res.json())
            .then(dados => {

                console.log(dados);

                var review = dados;

                var feed = document.getElementById("feed_container");
                feed.innerHTML = "";

                for (let i = 0; i < review.length; i++) {
                    var publicacao = review[i];

                    // criando itens
                    var divPublicacao = document.createElement("div");
                    var spanID = document.createElement("span");
                    var spanTitulo = document.createElement("span");
                    var spanNome = document.createElement("span");
                    var spanNota = document.createElement("span");
                    var divDescricao = document.createElement("div");
                    var divButtons = document.createElement("div");
                    var btnCurtir = document.createElement("button");
                    var btnDeletar = document.createElement("button");

                    // -- criando texto

                    spanTitulo.innerHTML = "Título: <b>" + publicacao.Filme + "</b>";
                    spanNome.innerHTML = "Autor: <b>" + publicacao.Usuario + "</b>";
                    spanNota.innerHTML = "Nota: <b>" + publicacao.nota + "</b>";
                    divDescricao.innerHTML = "Descrição: <b>" + publicacao.review + "</b>";
                    btnCurtir.innerHTML = "Curtir";
                    btnDeletar.innerHTML = "Deletar";

                    // -- criando classe
                    divPublicacao.className = "publicacao";
                    spanTitulo.id = "inputNumero" + publicacao.idReview;
                    spanNome.className = "publicacao-nome";
                    spanNota.className = "publicacao-nota";
                    spanTitulo.className = "publicacao-titulo";
                    divDescricao.className = "publicacao-descricao";

                    divButtons.className = "div-buttons"

                    btnCurtir.className = "publicacao-btn-Curtir"
                    btnCurtir.id = "btnCurtir" + publicacao.idReview;
                    btnCurtir.setAttribute("onclick", `curtir(${publicacao.fkUsuario}, ${publicacao.fkFilme})`);

                    btnDeletar.className = "publicacao-btn-Curtir"
                    btnDeletar.id = "btnDeletar" + publicacao.idReview;
                    btnDeletar.setAttribute("onclick", `deletar(${publicacao.idReview})`);


                    // Definindo a hierarquia
                    divPublicacao.appendChild(spanID);
                    divPublicacao.appendChild(spanNome);
                    divPublicacao.appendChild(spanNota);
                    divPublicacao.appendChild(spanTitulo);
                    divPublicacao.appendChild(divDescricao);
                    divPublicacao.appendChild(divButtons);
                    divButtons.appendChild(btnCurtir);
                    divButtons.appendChild(btnDeletar);
                    feed.appendChild(divPublicacao);

                    if (nome != publicacao.Usuario) {   // escondendo botão de deletar

                        let deletar = document.getElementById("btnDeletar" + publicacao.idReview);
                        deletar.style.display = "none" 
                    }

                    if (nome == publicacao.Usuario) {  // escondendo botão de curtir
                        console.log(publicacao.Usuario)
                        let Curtir = document.getElementById("btnCurtir" + publicacao.idReview);
                        Curtir.style.display = "none"
                    }

                }

            })
            .catch(erro => {
                console.log("Erro:", erro);
            });


    }

    function deletar(idReview) {

        fetch(`/review/deletar/${idReview}`, {
            method: "DELETE",
            headers: {
                "Content-Type": "application/json"
            }
        }).then(function (resposta) {

            if (resposta.ok) {
                window.alert("Post deletado com sucesso");
                window.location = "./review.html"
            } else if (resposta.status == 404) {
                window.alert("Deu 404!");
            } else {
                throw ("Houve um erro ao tentar realizar a postagem!")
            }
        }).catch(function (resposta) {
            console.log(`#ERRO: ${resposta}`);
        });
    }


    function curtir(fkUsuario, idFilme) { // função para mandar a pontuacao

        var idUsuario = sessionStorage.ID_USUARIO;
        var idGrupo = Number(sessionStorage.getItem("ID_GRUPO"));
        var pontos = 5;
        var tipo = `curtida_review${idUsuario}`
        var idReferencia = idFilme;

        fetch("/review/curtir", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
            },
            body: JSON.stringify({
                fkUsuario: fkUsuario,
                idGrupo: idGrupo,
                pontos: pontos,
                tipo: tipo,
                idReferencia: idReferencia
            }),
        })
            .then(resposta => {
                console.log("resposta: ", resposta);

                if (resposta.ok) {
                    alert("Boa avaliação");
                } else if (resposta.status == 409) {
                    alert("Você já curtiu essa review")
                    throw "Este email já está cadastrado!";
                } else {
                    throw "Houve um erro ao tentar realizar a avaliação!";
                }
            })
            .catch(erro => {
                console.log(`#ERRO: ${erro}`);
            });
    }

</script>
